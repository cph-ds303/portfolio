<article class="max-w-full prose dark:prose-invert">
  {{ with .Title }}
    <header>
      <h1 class="mt-5 text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ . | emojify }}</h1>
    </header>
  {{ end }}
  <section class="w-full">{{ .Content }}</section>
</article>
<section>
  {{ partial "recent-articles/main.html" . }}
</section>
