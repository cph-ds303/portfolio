<article class="homepage-intro portfolio-motion-page">
  {{ with .Title }}
    <header class="homepage-intro__header">
      <h1 class="homepage-intro__title">{{ . | emojify }}</h1>
    </header>
  {{ end }}
  <section class="homepage-intro__content prose dark:prose-invert portfolio-motion-content">{{ .Content }}</section>
</article>
<section class="homepage-feature-links portfolio-motion-content" aria-label="Featured links">
  <a class="homepage-feature-card" href="{{ "projects/eru-project/" | relLangURL }}">
    <span class="homepage-feature-card__kicker">Project</span>
    <h2 class="homepage-feature-card__title">My most recent project.</h2>
  </a>
  <a class="homepage-feature-card" href="{{ "blog/first-steps/" | relLangURL }}">
    <span class="homepage-feature-card__kicker">Blog Post</span>
    <h2 class="homepage-feature-card__title">My first ever code.</h2>
  </a>
</section>
<section class="homepage-recent portfolio-motion-content">
  {{ partial "recent-articles/main.html" . }}
</section>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const page = document.querySelector(".homepage-intro.portfolio-motion-page");
    const contentBlocks = document.querySelectorAll(".portfolio-motion-content");
    if (!page || !contentBlocks.length) return;

    const heroHeading = page.querySelector("h1");
    const paragraphs = document.querySelectorAll(".portfolio-motion-content p");
    const headings = document.querySelectorAll(".portfolio-motion-content h2, .portfolio-motion-content h3");
    const featureCards = document.querySelectorAll(".homepage-feature-card");
    const listItems = document.querySelectorAll(".portfolio-motion-content ul li, .portfolio-motion-content ol li");

    page.classList.add("js-scroll-ready");
    heroHeading?.classList.add("portfolio-animate-in", "portfolio-heading-glow");

    paragraphs.forEach((paragraph, index) => {
      if (index < 2) {
        paragraph.classList.add("portfolio-animate-in");
      } else {
        paragraph.classList.add("portfolio-reveal", "portfolio-reveal--soft");
      }
    });

    headings.forEach((heading, index) => {
      heading.classList.add("portfolio-reveal", index % 2 === 0 ? "portfolio-reveal--left" : "portfolio-reveal--right");
    });

    featureCards.forEach((card, index) => {
      card.classList.add("portfolio-reveal", "portfolio-hover-lift", index % 2 === 0 ? "portfolio-reveal--left" : "portfolio-reveal--right");
    });

    listItems.forEach((item, index) => {
      item.classList.add("portfolio-reveal", "portfolio-reveal--soft");
      item.style.transitionDelay = `${Math.min(index % 6, 5) * 45}ms`;
    });

    const revealTargets = document.querySelectorAll(".portfolio-reveal");
    if (!("IntersectionObserver" in window)) {
      revealTargets.forEach((el) => el.classList.add("is-visible"));
      return;
    }

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      },
      {
        threshold: 0.16,
        rootMargin: "0px 0px -8% 0px",
      }
    );

    revealTargets.forEach((el) => observer.observe(el));

    const updateMotionChrome = () => {
      const scrollTop = window.scrollY || window.pageYOffset;
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = scrollHeight > 0 ? Math.min(scrollTop / scrollHeight, 1) : 0;
      document.documentElement.style.setProperty("--portfolio-scroll-progress", progress.toString());
      document.documentElement.style.setProperty("--portfolio-parallax-offset", `${scrollTop * -0.025}px`);
    };

    updateMotionChrome();
    let ticking = false;
    window.addEventListener("scroll", () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          updateMotionChrome();
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });
  });
</script>
