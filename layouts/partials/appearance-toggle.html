<button
  id="appearance-switcher"
  class="appearance-toggle"
  type="button"
  aria-label="Skift mellem lys og mørk tilstand"
  title="Skift mellem lys og mørk tilstand">
  <span class="appearance-toggle__mode dark:hidden" aria-hidden="true">
    {{ partial "icon.html" "moon" }}
    <span>Mørk</span>
  </span>
  <span class="appearance-toggle__mode hidden dark:flex" aria-hidden="true">
    {{ partial "icon.html" "sun" }}
    <span>Lys</span>
  </span>
</button>
